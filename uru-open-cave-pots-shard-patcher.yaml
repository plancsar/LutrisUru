game_slug: uru-open-cave-pots-shard
name: 'Uru: Open Cave PotS shard'
year: 2010
user: Korovev
runner: wine
slug: uru-open-cave-pots-shard-patcher
version: Patcher
notes: |
  Requires a (possibly new) Uru: Complete Chronicles installation.
  Make sure you select the Uru CC folder, not a file inside it!
credits: 'https://the-open-cave.net/tpots/how-to-play'
created_at: '2026-09-14T18:31:02.944335Z'
script:
  files:
  - urufolder: N/A:Please select an Uru CC folder
  - patcher: https://other.the-open-cave.net/installer/tocpatch.v3.zip
  game:
    exe: $GAMEDIR/drive_c/Program Files/Open Cave/UruSetup.exe
    prefix: $GAMEDIR
  installer:
  - task:
      name: create_prefix
      prefix: $GAMEDIR
  - merge:
      dst: $GAMEDIR/drive_c/Program Files/Open Cave/
      src: urufolder
  - extract:
      dst: $GAMEDIR/drive_c/Program Files/Open Cave/
      file: patcher
  - task:
      executable: $GAMEDIR/drive_c/Program Files/Open Cave/tocpatch.v3.exe
      args: /S /D="C:\Program Files\Open Cave"
      name: wineexec
      prefix: $GAMEDIR
