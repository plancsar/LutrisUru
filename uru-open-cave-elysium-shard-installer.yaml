game_slug: uru-toc-elysium-shard
name: 'Uru: Open Cave Elysium shard'
year: 2026
user: Korovev
runner: wine
slug: uru-toc-elysium-shard-installer
version: Installer
notes: |
  If the client crashes or you get visual artifacts, you may need to disable DXVK.
  Please uncheck the "Launch The Open Cave..." option from the last page of the installer.
  If the script fails to download the Windows installer, please download it manually from:
  https://other.the-open-cave.net/installer/TOC-Elysium-Installer.exe
credits: https://the-open-cave.net
script:
  files:
  - install: https://other.the-open-cave.net/installer/TOC-Elysium-Installer.exe
  game:
    exe: $GAMEDIR/drive_c/Program Files (x86)/TOC-Elysium/UruLauncher.exe
    prefix: $GAMEDIR
  installer:
  - task:
      name: create_prefix
      prefix: $GAMEDIR
  - task:
      executable: $install
      args: /S
      name: wineexec
      prefix: $GAMEDIR
  - task:
      app: physx
      name: winetricks
      prefix: $GAMEDIR
  wine:
    overrides:
      openal32: n,b
  
